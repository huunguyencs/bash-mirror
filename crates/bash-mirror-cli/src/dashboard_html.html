<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bash-mirror dashboard</title>
<style>
  :root {
    --bg: #0A0A0F;
    --surface: #111827;
    --text: #E2E8F0;
    --text-dim: #94A3B8;
    --accent: #22D3EE;
    --success: #10B981;
    --danger: #EF4444;
    --warning: #F97316;
    --border: #1E293B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    padding: 24px;
    max-width: 800px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; font-weight: 600; }
  h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header .url { color: var(--accent); font-size: 13px; }
  .header .uptime { color: var(--text-dim); font-size: 13px; }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }

  /* Token & QR */
  .token-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: start;
  }
  .token-details { min-width: 0; }
  .token-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .token-row label { color: var(--text-dim); font-size: 12px; width: 50px; flex-shrink: 0; }
  .token-value {
    background: var(--bg);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    word-break: break-all;
    border: 1px solid var(--border);
    transition: border-color 0.2s;
    flex: 1;
    min-width: 0;
  }
  .token-value:hover { border-color: var(--accent); }
  .token-value.copied { border-color: var(--success); }
  .short-code {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--accent);
  }
  .countdown { color: var(--text-dim); font-size: 13px; }
  .countdown.expiring { color: var(--warning); }
  .countdown.expired { color: var(--danger); }
  .qr-container {
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .qr-container svg { width: 100%; height: 100%; }

  .btn {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 6px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .btn:hover { background: var(--accent); color: var(--bg); }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: white; }

  .actions-row { display: flex; gap: 8px; margin-top: 12px; }

  /* Sessions table */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 12px;
    color: var(--text-dim);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  .status-alive { color: var(--success); }
  .status-dead { color: var(--danger); }
  .empty-state { color: var(--text-dim); text-align: center; padding: 24px; font-size: 13px; }

  /* Logs */
  .log-container {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    max-height: 300px;
    overflow-y: auto;
    padding: 12px;
    font-size: 12px;
    line-height: 1.8;
  }
  .log-container::-webkit-scrollbar { width: 6px; }
  .log-container::-webkit-scrollbar-track { background: transparent; }
  .log-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .log-entry { color: var(--text-dim); }
  .log-entry .log-time { color: var(--text-dim); opacity: 0.6; margin-right: 8px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>bash-mirror</h1>
    <span class="url" id="server-url">—</span>
  </div>
  <span class="uptime" id="uptime">uptime: —</span>
</div>

<div class="section">
  <h2>Token &amp; QR</h2>
  <div class="token-grid">
    <div class="token-details">
      <div class="token-row">
        <label>Token</label>
        <div class="token-value" id="token-value" onclick="copyToken()" title="Click to copy">—</div>
      </div>
      <div class="token-row">
        <label>Code</label>
        <span class="short-code" id="short-code">——————</span>
      </div>
      <div class="token-row">
        <label>TTL</label>
        <span class="countdown" id="countdown">—</span>
      </div>
      <div class="actions-row">
        <button class="btn" onclick="rotateToken()">Rotate Token</button>
      </div>
    </div>
    <div class="qr-container" id="qr-container"></div>
  </div>
</div>

<div class="section">
  <h2>Sessions</h2>
  <div id="sessions-content">
    <div class="empty-state">No active sessions</div>
  </div>
</div>

<div class="section">
  <h2>Logs</h2>
  <div class="log-container" id="log-container"></div>
</div>

<script>
(function() {
  let remainingSecs = 0;
  let tokenExpired = false;
  let countdownInterval = null;

  function formatUptime(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    const parts = [];
    if (h > 0) parts.push(h + 'h');
    parts.push(m + 'm');
    parts.push(s + 's');
    return parts.join(' ');
  }

  function updateCountdownDisplay() {
    const el = document.getElementById('countdown');
    if (tokenExpired || remainingSecs <= 0) {
      el.textContent = 'expired';
      el.className = 'countdown expired';
      tokenExpired = true;
      return;
    }
    el.textContent = remainingSecs + 's remaining';
    el.className = 'countdown' + (remainingSecs <= 30 ? ' expiring' : '');
  }

  function startCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(function() {
      if (remainingSecs > 0) {
        remainingSecs--;
        updateCountdownDisplay();
      }
    }, 1000);
  }

  function applyStatus(data) {
    document.getElementById('server-url').textContent = data.server_url;
    document.getElementById('uptime').textContent = 'uptime: ' + formatUptime(data.uptime_secs);

    if (data.token) {
      document.getElementById('token-value').textContent = data.token.token;
      document.getElementById('short-code').textContent = data.token.short_code;
      remainingSecs = data.token.remaining_secs;
      tokenExpired = data.token.expired;
      updateCountdownDisplay();
    } else {
      document.getElementById('token-value').textContent = 'No active token';
      document.getElementById('short-code').textContent = '——————';
      remainingSecs = 0;
      tokenExpired = true;
      updateCountdownDisplay();
    }

    renderSessions(data.sessions);
  }

  function renderSessions(sessions) {
    const container = document.getElementById('sessions-content');
    if (!sessions || sessions.length === 0) {
      container.innerHTML = '<div class="empty-state">No active sessions</div>';
      return;
    }
    let html = '<table><thead><tr><th>ID</th><th>Shell</th><th>Status</th><th>Action</th></tr></thead><tbody>';
    sessions.forEach(function(s) {
      const statusClass = s.alive ? 'status-alive' : 'status-dead';
      const statusText = s.alive ? 'alive' : 'dead';
      html += '<tr>';
      html += '<td>' + s.id.substring(0, 8) + '</td>';
      html += '<td>' + escapeHtml(s.shell) + '</td>';
      html += '<td class="' + statusClass + '">' + statusText + '</td>';
      html += '<td><button class="btn btn-danger" onclick="closeSession(\'' + escapeHtml(s.id) + '\')">Close</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addLog(message) {
    const container = document.getElementById('log-container');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const now = new Date();
    const time = now.toLocaleTimeString('en-US', { hour12: false });
    entry.innerHTML = '<span class="log-time">' + time + '</span>' + escapeHtml(message);
    container.appendChild(entry);
    container.scrollTop = container.scrollHeight;
  }

  async function fetchStatus() {
    try {
      const resp = await fetch('/api/status');
      if (resp.ok) {
        const data = await resp.json();
        applyStatus(data);
      }
    } catch (e) {
      console.error('Failed to fetch status:', e);
    }
  }

  async function fetchQR() {
    try {
      const resp = await fetch('/api/qr');
      if (resp.ok) {
        const svg = await resp.text();
        document.getElementById('qr-container').innerHTML = svg;
      } else {
        document.getElementById('qr-container').innerHTML = '<span style="color:var(--text-dim);font-size:12px">No QR available</span>';
      }
    } catch (e) {
      console.error('Failed to fetch QR:', e);
    }
  }

  window.copyToken = async function() {
    const el = document.getElementById('token-value');
    const text = el.textContent;
    if (!text || text === '—' || text === 'No active token') return;
    try {
      await navigator.clipboard.writeText(text);
      el.classList.add('copied');
      setTimeout(function() { el.classList.remove('copied'); }, 1500);
    } catch (e) {
      console.error('Copy failed:', e);
    }
  };

  window.rotateToken = async function() {
    try {
      const resp = await fetch('/api/rotate-token', { method: 'POST' });
      if (resp.ok) {
        await fetchStatus();
        await fetchQR();
        addLog('Token rotated');
      }
    } catch (e) {
      console.error('Rotate failed:', e);
    }
  };

  window.closeSession = async function(id) {
    try {
      const resp = await fetch('/api/sessions/' + id + '/close', { method: 'POST' });
      if (resp.ok) {
        await fetchStatus();
        addLog('Session ' + id.substring(0, 8) + ' closed');
      }
    } catch (e) {
      console.error('Close session failed:', e);
    }
  };

  function connectSSE() {
    const evtSource = new EventSource('/api/logs/stream');
    evtSource.onmessage = function(event) {
      addLog(event.data);
    };
    evtSource.onerror = function() {
      evtSource.close();
      setTimeout(connectSSE, 3000);
    };
  }

  // Init
  fetchStatus();
  fetchQR();
  startCountdown();
  connectSSE();

  // Poll status every 5 seconds
  setInterval(function() {
    fetchStatus();
  }, 5000);

  // Uptime tick every second
  let uptimeSecs = 0;
  setInterval(function() {
    const el = document.getElementById('uptime');
    const match = el.textContent.match(/\d+/g);
    // We rely on fetchStatus to correct drift; just increment display
  }, 1000);
})();
</script>
</body>
</html>
