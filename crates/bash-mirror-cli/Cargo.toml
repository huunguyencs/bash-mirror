[package]
name = "bash-mirror-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bash-mirror"
path = "src/main.rs"

[dependencies]
bash-mirror-core = { path = "../bash-mirror-core" }
bash-mirror-proto = { path = "../bash-mirror-proto" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio-rustls = "0.26"
qr2term = "0.3"
local-ip-address = "0.6"
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
qrcode = "0.14"
open = "5"
async-stream = "0.3"
