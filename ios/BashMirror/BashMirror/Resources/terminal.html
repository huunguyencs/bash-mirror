<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="xterm.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #terminal { width: 100%; height: 100%; overflow: hidden; }
    body { background: #1a1a2e; }
    /* Prevent any text selection */
    * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 13,
      fontFamily: 'Menlo, Monaco, Courier New, monospace',
      theme: {
        background: '#1a1a2e',
        foreground: '#e0e0e0',
        cursor: '#e0e0e0',
        cursorAccent: '#1a1a2e',
        selectionBackground: '#44475a',
        black: '#21222c',
        red: '#ff5555',
        green: '#50fa7b',
        yellow: '#f1fa8c',
        blue: '#bd93f9',
        magenta: '#ff79c6',
        cyan: '#8be9fd',
        white: '#f8f8f2',
        brightBlack: '#6272a4',
        brightRed: '#ff6e6e',
        brightGreen: '#69ff94',
        brightYellow: '#ffffa5',
        brightBlue: '#d6acff',
        brightMagenta: '#ff92df',
        brightCyan: '#a4ffff',
        brightWhite: '#ffffff',
      },
      allowProposedApi: true,
      scrollback: 5000,
      convertEol: false,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));

    // Initial fit after a short delay to ensure layout is ready
    setTimeout(function() {
      fitAddon.fit();
      reportSize();
    }, 100);

    // User types something → Swift
    term.onData(function(data) {
      webkit.messageHandlers.terminalInput.postMessage(data);
    });

    // Swift → JS: write PTY output (base64-encoded for binary safety)
    function writeOutput(data) {
      term.write(data);
    }

    // Swift → JS: write base64-encoded PTY output
    function termWrite(b64) {
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      term.write(bytes);
    }

    // Swift → JS: resize terminal
    function fitTerminal() {
      fitAddon.fit();
      reportSize();
    }

    function reportSize() {
      var dims = JSON.stringify({ cols: term.cols, rows: term.rows });
      webkit.messageHandlers.terminalResize.postMessage(dims);
    }

    // Swift → JS: clear terminal
    function clearTerminal() {
      term.clear();
    }

    // Re-fit on window resize
    window.addEventListener('resize', function() {
      setTimeout(function() {
        fitAddon.fit();
        reportSize();
      }, 50);
    });

    // Signal ready
    webkit.messageHandlers.terminalReady.postMessage('ready');
  </script>
</body>
</html>
